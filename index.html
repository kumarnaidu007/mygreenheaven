<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      sizes="64x64"
      href="/favicon.png?v=2"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07100b" />
    <script>
      ;(() => {
        const savedTheme = localStorage.getItem('mygreenheaven-theme')
        const preferredTheme = matchMedia('(prefers-color-scheme: light)').matches
          ? 'light'
          : 'dark'
        document.documentElement.dataset.theme =
          savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : preferredTheme
      })()
    </script>
    <meta
      name="description"
      content="mygreenheaven.in transforms balconies into green heavens with balcony makeovers, garden design, landscaping, and lifetime plant care."
    />
    <link rel="canonical" href="https://mygreenheaven.in/" />
    <title>
      mygreenheaven.in | Balcony Makeovers, Garden Design &amp; Plant Care
    </title>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="mygreenheaven.in" />
    <meta property="og:url" content="https://mygreenheaven.in/" />
    <meta
      property="og:title"
      content="mygreenheaven.in | Balcony Makeovers, Garden Design &amp; Plant Care"
    />
    <meta
      property="og:description"
      content="Transforming spaces into green heavens. Balcony makeovers, garden design, landscaping, and lifetime plant care."
    />
    <meta property="og:image" content="https://mygreenheaven.in/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "mygreenheaven.in",
        "url": "https://mygreenheaven.in/",
        "image": "https://mygreenheaven.in/og-image.jpg",
        "description": "Balcony makeovers, garden design, landscaping, and lifetime plant care.",
        "sameAs": ["https://www.instagram.com/mygreenheaven.in/"]
      }
    </script>
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
